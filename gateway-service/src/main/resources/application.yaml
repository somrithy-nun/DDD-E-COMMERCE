server:
  port: 8585

spring:
  application:
    name: gateway-service
  profiles:
    active: dev
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: vuejs
              uri: http://[::1]:5173
              predicates:
                - Path=/**
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          trusted-proxies: ".*"
          default-filters:
            - TokenRelay=
            - SaveSession
    nacos:
      discovery:
        namespace: ${spring.profiles.active}
      username: nacos
      password: nacos
      server-addr: 127.0.0.1:8848
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: https://sso.dtwg.dev/realms/ecommerce
        registration:
          ecommerce-postman:
            provider: keycloak
            client-id: ecommerce-postman
#            client-secret: YDdLvthAd1JhyRWrhKOmNThzfFDUKKdg
            scope:
              - openid
              - email
              - profile
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8585/login/oauth2/code/ecommerce-postman



management:
  endpoints:
    web:
      exposure:
        include: 'health,info,gateway'
  endpoint:
    gateway:
      access: read_only


scalar:
  sources:
    - title: Order Service
      url: /order-service/v3/api-docs
    - title: Customer Service
      url: /customer-service/v3/api-docs
    - title: User Service
      url: /user-service/v3/api-docs

springdoc:
  swagger-ui:
    urls:
      - name: order-service
        display-name: Order Service
        url: /order-service/v3/api-docs
      - name: customer-service
        display-name: Customer Service
        url: /customer-service/v3/api-docs
      - name: user-service
        display-name: User Service
        url: /user-service/v3/api-docs