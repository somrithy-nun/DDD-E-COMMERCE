server:
  port: 8585

spring:
  application:
    name: gateway-service
  profiles:
    active: dev
  data:
    redis:
      host: localhost
      port: 6379
  config:
    import:
      - nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}
  cloud:
    sentinel:

      transport:
        dashboard: localhost:8081
        port: 8719
      eager: true
#      web-context-unify: false
##      scg.fallback:
##        mode: response
##        response-status: 429
##        response-body: '{"error":"Too many requests at gateway"}'
      datasource:
        sentinel-flow: # name of datasource
          nacos: # dynamic datasource with nacos
            server-addr: 127.0.0.1:8848            # link to nacos
            username: nacos
            password: nacos
            data-id: sentinel-flow                # data-id of config file in nacos
            namespace: ${spring.profiles.active}   # namespace in nacos
            group-id: DEFAULT_GROUP            # group-id in nacos
            data-type: json                        # config format in nacos
            rule-type: flow
        sentinel-degrade:
          nacos:
            server-addr: 127.0.0.1:8848
            username: nacos
            password: nacos
            data-id: sentinel-degrade
            namespace: ${spring.profiles.active}
            group-id: DEFAULT_GROUP
            data-type: json
            rule-type: degrade

    gateway:
      server:
        webflux:
          routes:
            - id: vuejs
              uri: http://[::1]:5173
              predicates:
                - Path=/**
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          trusted-proxies: ".*"
          default-filters:
            - TokenRelay=
            - SaveSession
    nacos:
      config:
        file-extension: yml
        namespace: ${spring.profiles.active}
      discovery:
        namespace: ${spring.profiles.active}
      username: nacos
      password: nacos
      server-addr: 127.0.0.1:8848
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: https://sso.dtwg.dev/realms/ecommerce
        registration:
          ecommerce-postman:
            provider: keycloak
            client-id: ecommerce-postman
#            client-secret: YDdLvthAd1JhyRWrhKOmNThzfFDUKKdg
            scope:
              - openid
              - email
              - profile
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8585/login/oauth2/code/ecommerce-postman



management:
  endpoints:
    web:
      exposure:
        include: 'health,info,gateway'
  endpoint:
    gateway:
      access: read_only


scalar:
  sources:
    - title: Order Service
      url: /order-service/v3/api-docs
    - title: Customer Service
      url: /customer-service/v3/api-docs
    - title: User Service
      url: /user-service/v3/api-docs

springdoc:
  swagger-ui:
    urls:
      - name: order-service
        display-name: Order Service
        url: /order-service/v3/api-docs
      - name: customer-service
        display-name: Customer Service
        url: /customer-service/v3/api-docs
      - name: user-service
        display-name: User Service
        url: /user-service/v3/api-docs