#change customer service running port
server:
  port: 0
  forward-headers-strategy: framework


spring:
  application:
    name: customer-service
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        namespace: ${spring.profiles.active}
      username: nacos
      password: nacos
      server-addr: 127.0.0.1:8848
    sentinel:
      transport:
        dashboard: localhost:8081
        port: 8719
      eager: true
      web-context-unify: false
  datasource:
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
    url: jdbc:postgresql://localhost:5432/db_customer
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 10m        # default TTL for all caches
      cache-null-values: false

feign:
  sentinel:
    enabled: true
